<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국악퓨전 트로트 프롬프트 메이커 v10.0 (Production-Ready)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;700&family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --korean: #a05a3a; --korean2: #c8784f; --gold: #c9a84c; --gold2: #e8c96a; --text: #f0ece4; --text2: #bfb8aa;
  --bg: #0e0c09; --surface: #1a1710; --surface2: #252118; --surface3: #2e2820; --border: #3a3228; --border2: #4a4238;
  --muted: #7a7065; --red: #c84a4a; --green: #5aaa7a; --blue: #4a8ac8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
.container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
header { grid-column: 1 / -1; background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 10px; }
header h1 { font-family: 'Noto Serif KR', serif; font-size: 26px; color: var(--gold); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text2); margin-bottom: 5px; }
input, select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; width: 100%; }
.btn { padding: 10px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; background: var(--surface3); color: var(--text); }
.btn-gold { background: var(--gold); color: #000; font-weight: 700; }
.result-body { background: #111; padding: 15px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; color: #fff; min-height: 300px; max-height: 500px; overflow-y: auto; font-size: 13px; }
.validator-msg { color: var(--red); font-size: 12px; margin-top: 5px; padding: 5px; background: rgba(200,74,74,0.1); border-radius: 4px; display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="panel">
    <h1>v10.0 Production-Ready</h1>
    <!-- 제목 입력 필드 추가 -->
    <div class="section">
      <div class="section-title">7-1. 곡 제목 (후렴구 핵심 반복구)</div>
      <input type="text" id="songTitleInput" placeholder="예: 빈 탁자">
    </div>
    <div class="section">
      <div class="section-title">7. 가사 스토리텔링 서사 입력</div>
      <input type="text" id="userMessageInput" placeholder="예: 새벽 2시 을지로 3가 골목...">
    </div>
    <button class="btn btn-gold" onclick="generateAll()">⚡ 마스터피스 가사 생성</button>
  </div>

  <div class="panel">
    <h3>생성된 가사</h3>
    <div class="result-body" id="aiGeneratedLyrics">가사가 출력됩니다.</div>
    <div id="validatorMsg" class="validator-msg"></div>
  </div>
</div>

<script>
// [확장 데이터]
const KOREAN_FORBIDDEN = ['그대 품에 안기고', '눈물이 흘러내려', '보고싶어 보고싶어', '가슴이 시리네', '꽃바람이 분다', '사랑해 사랑해'];
const DATA = { /* 기존 데이터 유지 */ }; 
let SELECTIONS = { style: 'jang', moods: [], gugak: [], modern: [], vocal: null, commercial: 'radio' };
let ACTIVE_MODEL = 'haiku'; 
let SHORTS_MODE = false;

// [기능: Temperature 동적 제어]
function getTemperature() {
  const s = SELECTIONS.style;
  if (ACTIVE_MODEL === 'haiku' || ACTIVE_MODEL === 'gpt4omini') return 0.65;
  if (['song', 'yang'].includes(s)) return 0.72;
  if (['lim', 'jeon'].includes(s)) return 0.78;
  return 0.85;
}

// [기능: 가사 운율 검증]
function validateLyrics(lyrics) {
  const lines = lyrics.split('\n').filter(l => l.trim().length > 0);
  const warnEl = document.getElementById('validatorMsg');
  let issues = [];
  lines.forEach((line, idx) => {
    const len = line.replace(/[^\w\s가-힣]/g, "").length;
    if (len > 0 && (len < 4 || len > 14)) issues.push(`라인 ${idx+1}: 운율 확인`);
  });
  if (issues.length > 0) {
    warnEl.textContent = '⚠️ ' + issues.slice(0, 3).join(', ');
    warnEl.style.display = 'block';
  } else {
    warnEl.style.display = 'none';
  }
}

// [시스템 프롬프트 빌더 v10.0]
function buildSystemPrompt() {
  const title = document.getElementById('songTitleInput').value || "미정";
  return `당신은 ${SELECTIONS.style} 전문 작사가입니다.
  
  [곡 정보]
  - 제목: "${title}" (후렴 핵심 반복구로 사용 필수)
  
  [파트별 지시사항]
  - Intro: "${title}"의 핵심 사물/공간을 묘사하여 정경 세팅 (1~2줄).
  - Pre-Chorus: 감정 최고조, Chorus 진입 예고하는 긴장감 조성.
  - Chorus: 제목을 반복하여 중독성 극대화.
  - Outro: 제목의 여운을 담은 단독 문장 혹은 구음으로 마무리.
  
  [금지어 DB]
  - 한국어: ${KOREAN_FORBIDDEN.join(', ')}

  [운율/문법]
  - ${SELECTIONS.style === 'song' ? '고어체(~마오, ~하오) 및 4/4조 엄수' : '현대 구어체 및 감성적 묘사'}.
  - 행동으로 감정을 묘사(Show, Don't Tell).
  
  ${SHORTS_MODE ? '[쇼츠 전용] [Hook] 2줄, [Drop] 구음 1줄, [Outro] 제목+end로 60초 내 압축.' : ''}`;
}

// [핵심 로직]
async function generateAll() {
  const apiKey = localStorage.getItem('OPENROUTER_API_KEY_TROT_V6'); // 키 저장소 명칭 유지
  const title = document.getElementById('songTitleInput').value;
  if (!apiKey) { alert('API 키를 설정해주세요.'); return; }
  if (!title) { alert('곡 제목을 입력해주세요.'); return; }
  
  // promptForAI 구성
  const promptForAI = `곡 제목: ${title}\n서사: ${document.getElementById('userMessageInput').value}`;
  
  try {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "anthropic/claude-3-5-haiku", // 예시 모델
        messages: [{ role: "system", content: buildSystemPrompt() }, { role: "user", content: promptForAI }],
        temperature: getTemperature()
      })
    });
    const data = await response.json();
    const lyricsPart = data.choices[0].message.content;
    
    document.getElementById('aiGeneratedLyrics').textContent = lyricsPart;
    validateLyrics(lyricsPart); // 검증 로직 실행
  } catch (err) { alert('통신 에러'); }
}
</script>
</body>
</html>

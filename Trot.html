<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국악퓨전 트로트 프롬프트 메이커 v10.0 (Production-Ready)</title>
<!-- [기존 스타일 유지 및 기능 확장] -->
<style>
/* 기존 스타일 생략 (소스 2 스타일 유지) */
:root { --korean: #a05a3a; --gold: #c9a84c; --text: #f0ece4; --bg: #0e0c09; --surface: #1a1710; --border: #3a3228; --red: #c84a4a; --blue: #4a8ac8; }
/* ... (생략: 기존 소스와 동일) ... */
</style>
</head>
<body>
<!-- [본문 구조 업데이트] -->
<div class="container">
  <header>
    <div class="version-badge">v10.0 Production-Ready</div>
    <h1>국악퓨전 트로트 프롬프트 메이커</h1>
  </header>

  <div class="panel">
    <!-- [추가] 제목 입력 섹션 -->
    <div class="section">
      <div class="section-title">7-1. 곡 제목 (후렴구 핵심 반복구)</div>
      <input type="text" id="songTitleInput" placeholder="예: 빈 탁자">
    </div>
    <!-- ... (이하 기존 제어 패널 UI) ... -->
    <div class="section">
      <div class="section-title">7. 가사 스토리텔링 서사 입력</div>
      <input type="text" id="userMessageInput" placeholder="예: 새벽 2시 을지로 3가 골목...">
    </div>
    <button class="btn btn-gold" onclick="generateAll()">⚡ 마스터피스 가사 생성</button>
  </div>

  <div class="panel">
    <div class="result-card">
      <div class="result-card-title">🔥 [PRO] 검증된 국악 트로트 가사</div>
      <div class="result-body" id="aiGeneratedLyrics">가사가 출력됩니다.</div>
      <div id="validatorMsg" style="color: var(--red); font-size: 11px; margin-top: 5px; display: none;"></div>
    </div>
  </div>
</div>

<script>
// [확장 데이터]
const KOREAN_FORBIDDEN = ['그대 품에 안기고', '눈물이 흘러내려', '보고싶어 보고싶어', '가슴이 시리네', '꽃바람이 분다', '사랑해 사랑해'];

// [기능: Temperature 동적 제어]
function getTemperature() {
  const m = ACTIVE_MODEL;
  const s = SELECTIONS.style;
  if (m === 'haiku' || m === 'gpt4omini') return 0.65;
  if (['song', 'yang'].includes(s)) return 0.72;
  if (['lim', 'jeon'].includes(s)) return 0.78;
  return 0.85;
}

// [기능: 가사 운율/길이 검증]
function validateLyrics(lyrics) {
  const lines = lyrics.split('\n').filter(l => l.trim().length > 0);
  const warnEl = document.getElementById('validatorMsg');
  let issues = [];
  
  lines.forEach((line, idx) => {
    const len = line.replace(/[^\w\s가-힣]/g, "").length;
    if (len > 0 && (len < 4 || len > 14)) {
      issues.push(`라인 ${idx+1}: 운율(길이) 경고`);
    }
  });

  if (issues.length > 0) {
    warnEl.textContent = '⚠️ ' + issues.slice(0, 3).join(', ');
    warnEl.style.display = 'block';
  } else {
    warnEl.style.display = 'none';
  }
}

// [시스템 프롬프트 빌더 v10.0]
function buildSystemPrompt() {
  const isHaiku = (ACTIVE_MODEL === 'haiku' || ACTIVE_MODEL === 'gpt4omini');
  const title = document.getElementById('songTitleInput').value || "미정";
  
  if (isHaiku) {
    return `작사가 모드: 트로트. 제목: "${title}" (후렴 반복). ${SELECTIONS.style} 스타일. 4/4조 운율 엄수. 금지어 사용 금지. Intro/Outro 필수 포함.`;
  }

  return `당신은 ${SELECTIONS.style} 전문 작사가입니다.
  
  [곡 정보]
  - 제목: "${title}" (후렴 핵심 반복구로 사용 필수)
  - 조성: ${SELECTIONS.moods.map(m => m.tradScale).join(', ')}
  
  [파트별 지시사항]
  - Intro: "${title}"의 핵심 사물/공간을 묘사하여 정경 세팅 (1~2줄).
  - Pre-Chorus: 감정 최고조, Chorus 진입 예고하는 긴장감 조성.
  - Chorus: 제목을 반복하여 중독성 극대화.
  - Outro: 제목의 여운을 담은 단독 문장 혹은 구음으로 마무리.
  
  [금지어 DB]
  - 영어: ${DATA.overusedWords.join(', ')}
  - 한국어: ${KOREAN_FORBIDDEN.join(', ')}

  [운율/문법]
  - ${SELECTIONS.style === 'song' ? '고어체(~마오, ~하오) 및 4/4조 엄수' : '현대 구어체 및 감성적 묘사'}.
  - 행동으로 감정을 묘사(Show, Don't Tell).
  
  ${SHORTS_MODE ? '[쇼츠 전용] [Hook] 2줄, [Drop] 구음 1줄, [Outro] 제목+end로 60초 내 압축.' : ''}
  `;
}

// [핵심 로직 수정]
async function generateAll() {
  const apiKey = getApiKey();
  const title = document.getElementById('songTitleInput').value;
  if (!title) { showToast('⚠️ 곡 제목을 입력해주세요.'); return; }
  
  const currentCombination = `곡 제목: ${title}\n` + document.getElementById('originalStylePrompt').textContent;
  const targetModelObj = DATA.aiModels.find(x => x.id === ACTIVE_MODEL);
  
  setLoading(true, "작사 엔진 가동 중...");

  try {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: targetModelObj.sub,
        messages: [{ role: "system", content: buildSystemPrompt() }, { role: "user", content: `기반 인풋:\n${currentCombination}` }],
        temperature: getTemperature()
      })
    });

    const data = await response.json();
    const resultText = data.choices[0].message.content;
    
    // ... (기존 파싱 로직 동일) ...
    document.getElementById('aiGeneratedLyrics').textContent = lyricsPart;
    validateLyrics(lyricsPart); // 검증 실행
    showToast('✅ v10.0 가사 생성 및 검증 완료');
    
  } catch (err) { showToast('❌ 작사 코어 통신 에러'); } finally { setLoading(false); }
}
// ... (기타 함수 생략: 원본 유지) ...
</script>
</body>
</html>

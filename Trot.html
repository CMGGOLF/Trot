<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>국악퓨전 트로트 메이커 v9.1 - 안정화 버전</title>
<style>
    body { background: #0e0c09; color: #f0ece4; font-family: sans-serif; padding: 20px; }
    .main-box { max-width: 800px; margin: auto; background: #1a1710; padding: 20px; border-radius: 10px; border: 1px solid #3a3228; }
    .input-area { margin-bottom: 20px; }
    textarea { width: 100%; height: 150px; background: #252118; color: #fff; border: 1px solid #4a4238; padding: 10px; margin-top: 10px; }
    .btn { padding: 10px 20px; cursor: pointer; background: #a05a3a; color: white; border: none; border-radius: 5px; }
    #output { margin-top: 20px; border: 1px solid #c9a84c; padding: 15px; white-space: pre-wrap; color: #e8c96a; }
</style>
</head>
<body>
    <div class="main-box">
        <h1>국악퓨전 트로트 메이커 v9.1</h1>
        <div class="input-area">
            <input type="password" id="apiKey" placeholder="OpenRouter API Key 입력" style="width:100%; padding:10px; background:#252118; color:#fff;">
            <textarea id="userInput" placeholder="가사 스토리와 상황을 입력하세요..."></textarea>
            <button class="btn" onclick="startGeneration()">⚡ 마스터피스 생성 시작</button>
        </div>
        <div id="output">생성된 가사가 여기에 출력됩니다.</div>
    </div>

<script>
async function startGeneration() {
    const key = document.getElementById('apiKey').value;
    const input = document.getElementById('userInput').value;
    const out = document.getElementById('output');
    out.innerText = "생성 중... 잠시만 기다려주세요.";

    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "google/gemini-2.5-flash",
                messages: [{ role: "user", content: `주제: ${input}\n\n[작사 가이드]\n1. 국악/서양 악기 명칭 가사 내 절대 금지.\n2. 7-5조 또는 4-4조 운율 엄수.\n3. 화음 코러스 (우우~), 구음 [Gugak Guum], 애드리브 [Ad-lib] 태그 삽입.\n4. 기계적 찌꺼기 없이 순수 가사만 출력.` }]
            })
        });
        const data = await response.json();
        out.innerText = data.choices[0].message.content;
    } catch (e) {
        out.innerText = "통신 오류 발생: " + e.message;
    }
}
</script>
</body>
</html>
